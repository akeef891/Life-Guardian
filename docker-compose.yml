version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: life_guardian_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: life_guardian
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - life_guardian_pg_data:/var/lib/postgresql/data

volumes:
  life_guardian_pg_data:
